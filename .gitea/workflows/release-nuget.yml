name: Release NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package_version:
        description: Optional SemVer package version. Defaults to a timestamped dev prerelease.
        type: string
        required: false
      push_to_baget:
        description: Push to internal BaGet (nuget.sabp.ir)
        type: boolean
        default: true
      push_to_nuget_org:
        description: Also push to nuget.org (manual opt-in only)
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  HARBOR_REGISTRY: reg.sabp.ir
  SDK_IMAGE: reg.sabp.ir/sufi-chain/dotnet-sdk-build:10.0.202
  GIT_HOST: git.sabp.ir
  REPOSITORY: ${{ gitea.repository }}
  REF_NAME: ${{ gitea.ref_name }}
  RELEASE_TAG: ${{ gitea.event.release.tag_name }}
  INPUT_PACKAGE_VERSION: ${{ inputs.package_version }}
  INPUT_PUSH_TO_BAGET: ${{ inputs.push_to_baget }}
  INPUT_PUSH_TO_NUGET_ORG: ${{ inputs.push_to_nuget_org }}
  BAGET_SOURCE_URL: https://nuget.sabp.ir/v3/index.json
  NUGET_ORG_SOURCE_URL: https://api.nuget.org/v3/index.json
  NUGET_PUSH_PARALLELISM: 4
  PACKAGE_OUTPUT: ./artifacts/nuget
  ROOT_SLNX: SufiChain.SufiAbp.slnx
  WORKSPACE_DIR: ${{ github.workspace }}

concurrency:
  group: release-nuget-${{ gitea.ref_name }}
  cancel-in-progress: false

jobs:
  pack-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check runner prerequisites
        shell: sh
        run: |
          set -eu
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker CLI is required on the runner." >&2
            echo "Map ubuntu-latest to docker:27-cli and mount /var/run/docker.sock into act_runner." >&2
            exit 1
          fi
          if ! docker version >/dev/null 2>&1; then
            echo "docker CLI exists, but cannot reach Docker daemon." >&2
            echo "Check Docker service and /var/run/docker.sock mount/permissions for the Gitea runner." >&2
            exit 1
          fi

      - name: Login to Harbor
        shell: sh
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -eu
          if [ -z "${HARBOR_USERNAME:-}" ] || [ -z "${HARBOR_PASSWORD:-}" ]; then
            echo "HARBOR_USERNAME and HARBOR_PASSWORD secrets are required." >&2
            exit 1
          fi
          echo "Checking DNS for $HARBOR_REGISTRY from the runner host..."
          if command -v getent >/dev/null 2>&1; then
            getent hosts "$HARBOR_REGISTRY" || {
              echo "DNS lookup failed for $HARBOR_REGISTRY." >&2
              echo "Fix the Gitea runner host DNS/Docker daemon DNS; current /etc/resolv.conf:" >&2
              cat /etc/resolv.conf >&2 || true
              exit 1
            }
          fi
          for attempt in 1 2 3; do
            if echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" \
              -u "$HARBOR_USERNAME" \
              --password-stdin; then
              exit 0
            fi
            echo "Harbor login failed (attempt $attempt/3)." >&2
            sleep $((attempt * 5))
          done
          echo "Harbor login failed after 3 attempts." >&2
          exit 1

      - name: Checkout
        shell: sh
        env:
          GITEATOKEN: ${{ secrets.GITEATOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -eu
          workspace="${WORKSPACE_DIR:-${GITHUB_WORKSPACE:-$PWD}}"
          cd "$workspace"
          echo "Using workspace: $workspace"

          echo "Cleaning workspace to ensure fresh checkout..."
          if [ -f "$ROOT_SLNX" ] || [ -d ".git" ]; then
            echo "Found existing repository files, removing..."
            rm -rf .git modules frameworks templates src test .gitea .gitignore *.slnx *.props *.targets *.md || true
            echo "Workspace cleaned"
          else
            echo "Workspace is already clean"
          fi

          echo "Runner workspace is empty; cloning with SDK container."
          CLONE_URL="https://${GIT_HOST}/${REPOSITORY}.git"
          clone_token="${GITEATOKEN:-${GITEA_TOKEN:-${GITHUB_TOKEN:-}}}"
          if [ -n "$clone_token" ]; then
            GITEATOKEN="$clone_token"
            CLONE_URL="$(printf '%s' "$CLONE_URL" | sed "s#^https://#https://x-access-token:${GITEATOKEN}@#")"
          else
            echo "No GITEATOKEN/GITEA_TOKEN/GITHUB_TOKEN secret was provided; private repository checkout may fail." >&2
          fi
          export CLONE_URL
          container_id="$(docker run -d \
            -w /src \
            -e REF_NAME \
            -e CLONE_URL \
            "$SDK_IMAGE" \
            sleep 3600)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT INT TERM
          docker exec "$container_id" sh -c '
            set -eu
            if [ -n "${REF_NAME:-}" ]; then
              echo "Cloning branch/tag: $REF_NAME"
              git clone --depth 1 --branch "$REF_NAME" "$CLONE_URL" /src
            else
              echo "Cloning default branch"
              git clone --depth 1 "$CLONE_URL" /src
            fi
            echo "Clone completed. Checking repository structure..."
            ls -la /src/modules/ 2>/dev/null || echo "No modules directory"
            if [ -d /src/modules/calendar ]; then
              echo "Calendar directory exists, checking contents..."
              find /src/modules/calendar -name "*.csproj" | head -5
            else
              echo "WARNING: Calendar directory not found after clone"
            fi
            test -f "'"$ROOT_SLNX"'"
          '
          docker cp "${container_id}:/src/." "${workspace}/"
          echo "Files copied to workspace. Verifying Calendar presence..."
          if [ -d "${workspace}/modules/calendar" ]; then
            echo "Calendar directory exists in workspace"
            find "${workspace}/modules/calendar" -name "*.csproj" | wc -l
          else
            echo "WARNING: Calendar directory missing in workspace after docker cp"
          fi
          docker rm -f "$container_id"
          trap - EXIT INT TERM

          if [ ! -f "$ROOT_SLNX" ]; then
            echo "Checkout did not produce $ROOT_SLNX under $workspace" >&2
            find "$workspace" -maxdepth 2 -type f -name '*.slnx' 2>/dev/null | head -20 >&2 || true
            exit 1
          fi

      - name: Resolve package version
        id: version
        shell: sh
        run: |
          set -eu
          if [ -n "${RELEASE_TAG:-}" ]; then
            version="$RELEASE_TAG"
          elif [ -n "${INPUT_PACKAGE_VERSION:-}" ]; then
            version="$INPUT_PACKAGE_VERSION"
          else
            version="0.0.0-dev.$(date +%Y%m%d%H%M%S)"
          fi
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+([.][0-9]+){2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?([+][0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "Invalid NuGet package version: $version" >&2
            echo "Use SemVer like 1.2.3, 1.2.3-beta.1, or v1.2.3." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Restore, build and pack root solution
        shell: sh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if [ -z "${VERSION:-}" ]; then
            echo "Package version was not resolved (steps.version.outputs.version is empty)." >&2
            exit 1
          fi
          workspace="${WORKSPACE_DIR:-${GITHUB_WORKSPACE:-$PWD}}"
          cd "$workspace"
          echo "Using workspace: $workspace"
          version_package_output="${PACKAGE_OUTPUT%/}/${VERSION}"
          package_dir="${workspace}/${version_package_output#./}"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          
          echo "Workspace diagnostics before container creation:"
          echo "  workspace variable: ${workspace}"
          echo "  PWD: $PWD"
          echo "  Checking if running inside container:"
          if [ -f /.dockerenv ] || grep -q docker /proc/1/cgroup 2>/dev/null; then
            echo "  DETECTED: Runner is inside a container"
            echo "  Volume mount will fail - workspace path doesn't exist on Docker host"
            echo "  Checking for alternative mount strategies..."
            docker_host_workspace="${GITHUB_WORKSPACE:-}"
            if [ -n "$docker_host_workspace" ]; then
              echo "  Will try GITHUB_WORKSPACE: $docker_host_workspace"
            fi
          else
            echo "  Runner is on bare metal, volume mount should work"
          fi
          
          container_id="$(docker run -d \
            -v "${workspace}:/src" \
            -w /src \
            -e VERSION \
            -e PACKAGE_OUTPUT="$version_package_output" \
            -e ROOT_SLNX \
            -e DOTNET_NOLOGO \
            -e DOTNET_CLI_TELEMETRY_OPTOUT \
            -e DOTNET_SKIP_FIRST_TIME_EXPERIENCE \
            "$SDK_IMAGE" \
            sleep 3600)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT INT TERM
          
          echo "Verifying Calendar module projects are present in container..."
          echo "First, checking workspace on runner before container check:"
          if [ -d "${workspace}/modules/calendar" ]; then
            calendar_count="$(find "${workspace}/modules/calendar" -name '*.csproj' 2>/dev/null | wc -l)"
            echo "Found $calendar_count Calendar .csproj files in runner workspace"
          else
            echo "ERROR: Calendar directory missing from runner workspace at ${workspace}/modules/calendar" >&2
          fi
          
          echo "Now checking inside pack container..."
          echo "Container mount point contents:"
          docker exec "$container_id" ls -la /src/ | head -20
          echo ""
          echo "Checking if modules directory exists in container:"
          docker exec "$container_id" ls -la /src/modules/ 2>/dev/null | head -10 || echo "modules/ directory not found in container"
          echo ""
          echo "Attempting to find ANY .csproj in container:"
          docker exec "$container_id" find /src -name "*.csproj" -type f 2>/dev/null | head -10 || echo "No .csproj files found"
          echo ""
          echo "Checking workspace variable value: ${workspace}"
          echo ""
          
          calendar_projects="$(docker exec "$container_id" find /src/modules/calendar/src -name '*.csproj' 2>/dev/null || true)"
          if [ -z "$calendar_projects" ]; then
            echo "WARNING: No Calendar .csproj files found in container at /src/modules/calendar/src" >&2
          else
            echo "Found Calendar projects in container:"
            echo "$calendar_projects"
          fi
          
          docker exec "$container_id" bash /src/.gitea/scripts/nuget-pack.sh
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          docker cp "${container_id}:/src/${version_package_output#./}/." "$package_dir/"
          docker rm -f "$container_id"
          trap - EXIT INT TERM
          if [ ! -d "$package_dir" ]; then
            echo "Package output directory was not created on the runner workspace: $package_dir" >&2
            echo "Workspace contents:" >&2
            find "$workspace" -maxdepth 2 \( -type d -o -type f -name '*.slnx' \) | sort >&2
            exit 1
          fi
          stale_packages="$(find "$package_dir" -type f -name '*.nupkg' ! -name '*.symbols.nupkg' ! -name "*.${VERSION}.nupkg" | sort || true)"
          if [ -n "$stale_packages" ]; then
            echo "Removing package(s) that do not match resolved version $VERSION:" >&2
            printf '%s\n' "$stale_packages" >&2
            find "$package_dir" -type f -name '*.nupkg' ! -name '*.symbols.nupkg' ! -name "*.${VERSION}.nupkg" -exec rm -f {} +
          fi
          package_count="$(find "$package_dir" -type f -name "*.${VERSION}.nupkg" ! -name '*.symbols.nupkg' | wc -l | tr -d ' ')"
          if [ "$package_count" = "0" ]; then
            echo "No NuGet packages for resolved version $VERSION were produced in $package_dir." >&2
            exit 1
          fi
          echo "Packed $package_count package(s) for version $VERSION into $package_dir."

      - name: Push packages to BaGet
        if: ${{ gitea.event_name == 'release' || inputs.push_to_baget == true }}
        shell: sh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "NUGET_API_KEY secret is required." >&2
            exit 1
          fi
          workspace="${WORKSPACE_DIR:-${GITHUB_WORKSPACE:-$PWD}}"
          cd "$workspace"
          docker run --rm \
            -v "${workspace}:/src" \
            -w /src \
            -e NUGET_API_KEY \
            -e VERSION \
            -e BAGET_SOURCE_URL \
            -e NUGET_PUSH_PARALLELISM \
            -e PACKAGE_OUTPUT="${PACKAGE_OUTPUT%/}/${VERSION}" \
            "$SDK_IMAGE" \
            bash /src/.gitea/scripts/nuget-push-baget.sh

      - name: Push packages to nuget.org
        if: ${{ gitea.event_name == 'workflow_dispatch' && inputs.push_to_nuget_org == true && inputs.package_version != '' }}
        shell: sh
        env:
          NUGET_ORG_API_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if [ -z "${NUGET_ORG_API_KEY:-}" ]; then
            echo "NUGET_ORG_API_KEY secret is required for nuget.org push." >&2
            exit 1
          fi
          workspace="${WORKSPACE_DIR:-${GITHUB_WORKSPACE:-$PWD}}"
          cd "$workspace"
          docker run --rm \
            -v "${workspace}:/src" \
            -w /src \
            -e NUGET_ORG_API_KEY \
            -e VERSION \
            -e NUGET_ORG_SOURCE_URL \
            -e NUGET_PUSH_PARALLELISM \
            -e PACKAGE_OUTPUT="${PACKAGE_OUTPUT%/}/${VERSION}" \
            "$SDK_IMAGE" \
            bash /src/.gitea/scripts/nuget-push-nuget-org.sh
