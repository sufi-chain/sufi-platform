name: Release NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package_version:
        description: Optional SemVer package version. Defaults to a timestamped dev prerelease.
        type: string
        required: false
      push_to_baget:
        description: Push to internal BaGet (nuget.sabp.ir)
        type: boolean
        default: true
      push_to_nuget_org:
        description: Also push to nuget.org (manual opt-in only)
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  HARBOR_REGISTRY: reg.sabp.ir
  SDK_IMAGE: reg.sabp.ir/sufi-chain/dotnet-sdk-build:10.0.202
  GIT_CLONE_IMAGE: reg.sabp.ir/sufi-chain/dotnet-sdk-build:10.0.202
  GIT_HOST: git.sabp.ir
  BAGET_SOURCE_URL: https://nuget.sabp.ir/v3/index.json
  NUGET_ORG_SOURCE_URL: https://api.nuget.org/v3/index.json
  NUGET_PUSH_PARALLELISM: 4
  PACKAGE_OUTPUT: ./artifacts/nuget
  NUGET_ARTIFACT_NAME: nuget-packages
  ROOT_SLNX: SufiChain.SufiAbp.slnx
  RELEASE_TAG: ${{ gitea.event.release.tag_name }}
  REF_NAME: ${{ gitea.ref_name }}
  REPOSITORY: ${{ gitea.repository }}
  INPUT_PACKAGE_VERSION: ${{ inputs.package_version }}

concurrency:
  group: release-nuget-${{ gitea.ref_name }}
  cancel-in-progress: false

# No job-level container: upload/download-artifact need Node.js on the runner host.
# dotnet restore/build/push runs in SDK_IMAGE via docker run (runner must have Docker + Harbor login).

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG:-}" ]; then
            version="$RELEASE_TAG"
          elif [ -n "${INPUT_PACKAGE_VERSION:-}" ]; then
            version="$INPUT_PACKAGE_VERSION"
          else
            version="0.0.0-dev.$(date +%Y%m%d%H%M%S)"
          fi
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "Invalid NuGet package version: $version" >&2
            echo "Use SemVer like 1.2.3, 1.2.3-beta.1, or v1.2.3." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

  pack:
    needs: resolve-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Login to Harbor
        shell: bash
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" \
            -u "$HARBOR_USERNAME" --password-stdin

      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-$PWD}"
          if command -v git >/dev/null 2>&1; then
            if [ -n "${REF_NAME:-}" ]; then
              git clone --depth 1 --branch "$REF_NAME" "https://${GIT_HOST}/${REPOSITORY}.git" .
            else
              git clone --depth 1 "https://${GIT_HOST}/${REPOSITORY}.git" .
            fi
          else
            parent="$(dirname "$ws")"
            mount_dest="$(basename "$ws")"
            docker run --rm \
              -v "${parent}:/work" \
              -w "/work/${mount_dest}" \
              -e REF_NAME \
              -e REPOSITORY \
              -e GIT_HOST \
              "$GIT_CLONE_IMAGE" \
              bash -c '
                set -euo pipefail
                url="https://${GIT_HOST}/${REPOSITORY}.git"
                if [ -n "${REF_NAME:-}" ]; then
                  git clone --depth 1 --branch "$REF_NAME" "$url" _checkout
                else
                  git clone --depth 1 "$url" _checkout
                fi
                shopt -s dotglob
                mv _checkout/* ./
                rmdir _checkout
              '
          fi

      - name: Restore, build and pack root solution
        shell: bash
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-$PWD}"
          docker run --rm \
            -v "${ws}:/src" \
            -w /src \
            -e VERSION \
            -e PACKAGE_OUTPUT \
            -e ROOT_SLNX \
            -e DOTNET_NOLOGO \
            -e DOTNET_CLI_TELEMETRY_OPTOUT \
            -e DOTNET_SKIP_FIRST_TIME_EXPERIENCE \
            "$SDK_IMAGE" \
            bash /src/.gitea/scripts/nuget-pack.sh

      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find "$PACKAGE_OUTPUT" -type f -name '*.nupkg' ! -name '*.symbols.nupkg')
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No NuGet packages were produced."
            exit 1
          fi
          echo "Packed ${#packages[@]} package(s)"

      - name: Upload NuGet packages
        uses: https://git.sabp.ir/actions/upload-artifact@v4
        with:
          name: ${{ env.NUGET_ARTIFACT_NAME }}
          path: ${{ env.PACKAGE_OUTPUT }}/
          if-no-files-found: error
          retention-days: 7

  push-baget:
    needs: [resolve-version, pack]
    if: ${{ always() && needs.resolve-version.result == 'success' && needs.pack.result == 'success' && (gitea.event_name == 'release' || inputs.push_to_baget == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Login to Harbor
        shell: bash
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" \
            -u "$HARBOR_USERNAME" --password-stdin

      - name: Checkout CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-$PWD}"
          if command -v git >/dev/null 2>&1; then
            if [ -n "${REF_NAME:-}" ]; then
              git clone --depth 1 --branch "$REF_NAME" "https://${GIT_HOST}/${REPOSITORY}.git" repo
            else
              git clone --depth 1 "https://${GIT_HOST}/${REPOSITORY}.git" repo
            fi
          else
            docker run --rm \
              -v "${ws}:/work" \
              -w /work \
              -e REF_NAME \
              -e REPOSITORY \
              -e GIT_HOST \
              "$GIT_CLONE_IMAGE" \
              bash -c '
                set -euo pipefail
                url="https://${GIT_HOST}/${REPOSITORY}.git"
                if [ -n "${REF_NAME:-}" ]; then
                  git clone --depth 1 --branch "$REF_NAME" "$url" repo
                else
                  git clone --depth 1 "$url" repo
                fi
              '
          fi

      - name: Download NuGet packages
        uses: https://git.sabp.ir/actions/download-artifact@v4
        with:
          name: ${{ env.NUGET_ARTIFACT_NAME }}
          path: ${{ env.PACKAGE_OUTPUT }}

      - name: Push packages to BaGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "NUGET_API_KEY secret is required."
            exit 1
          fi
          ws="${GITHUB_WORKSPACE:-$PWD}"
          docker run --rm \
            -v "${ws}:/src" \
            -w /src \
            -e NUGET_API_KEY \
            -e BAGET_SOURCE_URL \
            -e NUGET_PUSH_PARALLELISM \
            -e PACKAGE_OUTPUT \
            "$SDK_IMAGE" \
            bash /src/repo/.gitea/scripts/nuget-push-baget.sh

  push-nuget-org:
    needs: [resolve-version, pack]
    if: ${{ always() && needs.resolve-version.result == 'success' && needs.pack.result == 'success' && gitea.event_name == 'workflow_dispatch' && inputs.push_to_nuget_org == 'true' && inputs.package_version != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Login to Harbor
        shell: bash
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" \
            -u "$HARBOR_USERNAME" --password-stdin

      - name: Checkout CI scripts
        shell: bash
        run: |
          set -euo pipefail
          ws="${GITHUB_WORKSPACE:-$PWD}"
          if command -v git >/dev/null 2>&1; then
            if [ -n "${REF_NAME:-}" ]; then
              git clone --depth 1 --branch "$REF_NAME" "https://${GIT_HOST}/${REPOSITORY}.git" repo
            else
              git clone --depth 1 "https://${GIT_HOST}/${REPOSITORY}.git" repo
            fi
          else
            docker run --rm \
              -v "${ws}:/work" \
              -w /work \
              -e REF_NAME \
              -e REPOSITORY \
              -e GIT_HOST \
              "$GIT_CLONE_IMAGE" \
              bash -c '
                set -euo pipefail
                url="https://${GIT_HOST}/${REPOSITORY}.git"
                if [ -n "${REF_NAME:-}" ]; then
                  git clone --depth 1 --branch "$REF_NAME" "$url" repo
                else
                  git clone --depth 1 "$url" repo
                fi
              '
          fi

      - name: Download NuGet packages
        uses: https://git.sabp.ir/actions/download-artifact@v4
        with:
          name: ${{ env.NUGET_ARTIFACT_NAME }}
          path: ${{ env.PACKAGE_OUTPUT }}

      - name: Push packages to nuget.org
        shell: bash
        env:
          NUGET_ORG_API_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_ORG_API_KEY:-}" ]; then
            echo "NUGET_ORG_API_KEY secret is required for nuget.org push."
            exit 1
          fi
          ws="${GITHUB_WORKSPACE:-$PWD}"
          docker run --rm \
            -v "${ws}:/src" \
            -w /src \
            -e NUGET_ORG_API_KEY \
            -e NUGET_ORG_SOURCE_URL \
            -e NUGET_PUSH_PARALLELISM \
            -e PACKAGE_OUTPUT \
            "$SDK_IMAGE" \
            bash /src/repo/.gitea/scripts/nuget-push-nuget-org.sh
