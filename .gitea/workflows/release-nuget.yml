name: Release NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push_to_baget:
        description: Push to internal BaGet (nuget.sabp.ir)
        type: boolean
        default: true
      push_to_nuget_org:
        description: Also push to nuget.org (manual opt-in only)
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Phase 1: Liara SDK. Phase 2: reg.sabp.ir/sufi-chain/dotnet-sdk-build:10.0.202
  SDK_IMAGE: mcr-mirror.liara.ir/dotnet/sdk:10.0.202
  BAGET_SOURCE_URL: https://nuget.sabp.ir/v3/index.json
  NUGET_ORG_SOURCE_URL: https://api.nuget.org/v3/index.json
  NUGET_PUSH_PARALLELISM: 4
  PACKAGE_OUTPUT: ./artifacts/nuget
  NUGET_ARTIFACT_NAME: nuget-packages
  ROOT_SLNX: SufiChain.SufiAbp.slnx
  RELEASE_TAG: ${{ gitea.event.release.tag_name }}
  REF_NAME: ${{ gitea.ref_name }}
  REPOSITORY: ${{ gitea.repository }}

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG:-}" ]; then
            version="$RELEASE_TAG"
          else
            version="0.0.0-dev.$(date +%Y%m%d%H%M%S)"
          fi
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

  pack:
    needs: resolve-version
    runs-on: ubuntu-latest
    container:
      image: mcr-mirror.liara.ir/dotnet/sdk:10.0.202
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${REF_NAME:-}" ]; then
            git clone --depth 1 --branch "$REF_NAME" https://git.sabp.ir/sufi-chain/sufi-abp.git .
          else
            git clone --depth 1 https://git.sabp.ir/sufi-chain/sufi-abp.git .
          fi

      - name: Restore root solution
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore "$ROOT_SLNX" \
            --verbosity minimal \
            -p:NuGetAudit=false

      - name: Build and pack root solution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE_OUTPUT"
          dotnet build "$ROOT_SLNX" \
            --configuration Release \
            --no-restore \
            --verbosity minimal \
            -m \
            -p:PackageVersion="$VERSION" \
            -p:ContinuousIntegrationBuild=true \
            -p:BuildInParallel=true \
            -p:PackageOutputPath="$PWD/$PACKAGE_OUTPUT" \
            -p:GeneratePackageOnBuild=true

      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find "$PACKAGE_OUTPUT" -type f -name '*.nupkg' ! -name '*.symbols.nupkg')
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No NuGet packages were produced."
            exit 1
          fi
          echo "Packed ${#packages[@]} package(s)"

      - name: Upload NuGet packages
        uses: https://git.sabp.ir/actions/upload-artifact@v4
        with:
          name: ${{ env.NUGET_ARTIFACT_NAME }}
          path: ${{ env.PACKAGE_OUTPUT }}/
          if-no-files-found: error
          retention-days: 7

  push-baget:
    needs: [resolve-version, pack]
    if: ${{ always() && needs.resolve-version.result == 'success' && needs.pack.result == 'success' && (gitea.event_name == 'release' || inputs.push_to_baget == 'true') }}
    runs-on: ubuntu-latest
    container:
      image: mcr-mirror.liara.ir/dotnet/sdk:10.0.202
    steps:
      - name: Download NuGet packages
        uses: https://git.sabp.ir/actions/download-artifact@v4
        with:
          name: ${{ env.NUGET_ARTIFACT_NAME }}
          path: ${{ env.PACKAGE_OUTPUT }}

      - name: Push packages to BaGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "NUGET_API_KEY secret is required."
            exit 1
          fi
          mapfile -t packages < <(find "$PACKAGE_OUTPUT" -type f -name '*.nupkg' ! -name '*.symbols.nupkg' | sort)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No NuGet packages found in artifact."
            exit 1
          fi
          printf '%s\0' "${packages[@]}" | xargs -0 -n 1 -P "$NUGET_PUSH_PARALLELISM" sh -c '
            dotnet nuget push "$1" \
              --source "$BAGET_SOURCE_URL" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          ' sh

  push-nuget-org:
    needs: [resolve-version, pack]
    if: ${{ always() && needs.resolve-version.result == 'success' && needs.pack.result == 'success' && gitea.event_name == 'workflow_dispatch' && inputs.push_to_nuget_org == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: mcr-mirror.liara.ir/dotnet/sdk:10.0.202
    steps:
      - name: Download NuGet packages
        uses: https://git.sabp.ir/actions/download-artifact@v4
        with:
          name: ${{ env.NUGET_ARTIFACT_NAME }}
          path: ${{ env.PACKAGE_OUTPUT }}

      - name: Push packages to nuget.org
        shell: bash
        env:
          NUGET_ORG_API_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_ORG_API_KEY:-}" ]; then
            echo "NUGET_ORG_API_KEY secret is required for nuget.org push."
            exit 1
          fi
          mapfile -t packages < <(find "$PACKAGE_OUTPUT" -type f -name '*.nupkg' ! -name '*.symbols.nupkg' | sort)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No NuGet packages found in artifact."
            exit 1
          fi
          printf '%s\0' "${packages[@]}" | xargs -0 -n 1 -P "$NUGET_PUSH_PARALLELISM" sh -c '
            dotnet nuget push "$1" \
              --source "$NUGET_ORG_SOURCE_URL" \
              --api-key "$NUGET_ORG_API_KEY" \
              --skip-duplicate
          ' sh
