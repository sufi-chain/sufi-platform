version: '3.8'

services:
  # <TEMPLATE-REMOVE IF-NOT="db:efcore">
  # <TEMPLATE-REPLACE key="EF_DATABASE_SERVICE">
  postgres:
    image: postgres:16-alpine
    container_name: sufiplatform-layered-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: MyProjectName
    ports:
      - "5432:5432"
    volumes:
      - postgres_layered_data:/var/lib/postgresql/data
    networks:
      - sufiplatform-layered-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  # </TEMPLATE-REPLACE>
  # </TEMPLATE-REMOVE>

  # <TEMPLATE-REMOVE IF-NOT="db:mongodb">
  mongodb:
    image: mongo:7
    container_name: sufiplatform-layered-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: MyProjectName
    ports:
      - "27017:27017"
    volumes:
      - mongodb_layered_data:/data/db
    networks:
      - sufiplatform-layered-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  # </TEMPLATE-REMOVE>

  # Database migrator - runs once and exits
  db-migrator:
    image: sufiplatform/demoapp-layered-dbmigrator:latest
    container_name: sufiplatform-layered-dbmigrator
    build:
      context: ../../..
      dockerfile: hosts/layered/src/Sufi.DemoApp.DbMigrator/Dockerfile
    environment:
      # <TEMPLATE-REMOVE IF-NOT="db:efcore">
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=MyProjectName;Username=postgres;Password=postgres
      # </TEMPLATE-REMOVE>
      # <TEMPLATE-REMOVE IF-NOT="db:mongodb">
      - ConnectionStrings__Default=mongodb://admin:admin@mongodb:27017/MyProjectName?authSource=admin
      # </TEMPLATE-REMOVE>
    depends_on:
      # <TEMPLATE-REMOVE IF-NOT="db:efcore">
      postgres:
        condition: service_healthy
      # </TEMPLATE-REMOVE>
      # <TEMPLATE-REMOVE IF-NOT="db:mongodb">
      mongodb:
        condition: service_healthy
      # </TEMPLATE-REMOVE>
    networks:
      - sufiplatform-layered-network
    restart: "no"


  # Optional slim public host. It is off unless you pass: docker compose --profile public up -d
  cms-public:
    profiles: ["public"]
    image: ghcr.io/sufi-chain/sufi-cms-public:${SUFI_CMS_PUBLIC_TAG:-dev}
    container_name: sufiplatform-layered-cms-public
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      SufiCmsPublic__DeliveryBaseUrl: ${SUFI_CMS_PUBLIC_DELIVERY_URL:-http://host.docker.internal:8080}
      SufiCmsPublic__ConsoleBaseUrl: ${SUFI_CMS_PUBLIC_CONSOLE_URL:-http://host.docker.internal:8080}
      SufiCmsPublic__FormsApiBaseUrl: ${SUFI_CMS_PUBLIC_FORMS_URL:-http://host.docker.internal:8080}
      SufiCmsPublic__CanonicalOrigin: ${SUFI_CMS_PUBLIC_CANONICAL_ORIGIN:-}
      SufiCmsPublic__ReadToken: ${SUFI_CMS_PUBLIC_READ_TOKEN:-}
      SufiCmsPublic__WebhookSecret: ${SUFI_CMS_PUBLIC_WEBHOOK_SECRET:-}
    ports:
      - "8096:8080"
    networks:
      - sufiplatform-layered-network
    restart: unless-stopped

volumes:
  # <TEMPLATE-REMOVE IF-NOT="db:efcore">
  postgres_layered_data:
    name: sufiplatform_layered_postgres_data
    driver: local
  # </TEMPLATE-REMOVE>
  # <TEMPLATE-REMOVE IF-NOT="db:mongodb">
  mongodb_layered_data:
    name: sufiplatform_layered_mongodb_data
    driver: local
  # </TEMPLATE-REMOVE>

networks:
  sufiplatform-layered-network:
    name: sufiplatform-layered-network
    driver: bridge
